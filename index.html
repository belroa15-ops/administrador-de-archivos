<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f8f9fa">
<title>Administrador De Archivos</title>
<style>
:root{--bg:#f8f9fa;--sf:#fff;--sv:#f1f3f4;--pr:#1a73e8;--pc:#e8f0fe;--tx:#1f1f1f;--ts:#5f6368;--bd:#e0e0e0;--rd:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--sf:#1e2024;--sv:#2a2d32;--pr:#8ab4f8;--pc:#2b3a55;--tx:#e8eaed;--ts:#9aa0a6;--bd:#3c4043;--rd:#f28b82}}
:root[data-theme="dark"]{--bg:#121316;--sf:#1e2024;--sv:#2a2d32;--pr:#8ab4f8;--pc:#2b3a55;--tx:#e8eaed;--ts:#9aa0a6;--bd:#3c4043;--rd:#f28b82}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:10px 14px 6px;display:flex;align-items:center;gap:6px}
header h1{font-size:19px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:40px;height:40px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.ib:active,.row:active{background:var(--sv)}
main{flex:1;overflow-y:auto;padding:4px 14px 90px;contain:content}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:14px}
.pad{padding:14px}
h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin:6px 4px 8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--bd)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--pc);flex:none}
.grow{flex:1;min-width:0}.grow b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--ts)}
.bar{height:12px;border-radius:6px;background:var(--sv);display:flex;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500}
.tile:active{transform:scale(.96)}
.gridf{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gf{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;position:relative}
.gf .ic{margin:0 auto 6px;width:52px;height:52px;font-size:24px;border-radius:14px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ts)}
nav button span{padding:3px 18px;border-radius:14px;font-size:18px}
nav button.on{color:var(--tx);font-weight:500}nav button.on span{background:var(--pc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);white-space:nowrap;font-size:13px}
.chip.on{background:var(--pc);border-color:var(--pr)}
input{font:inherit;color:var(--tx);background:var(--sv);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0}
input:focus{border-color:var(--pr)}
.btn{background:var(--pr);color:var(--bg);padding:10px 20px;border-radius:20px;font-weight:500}
.btn.o{background:none;color:var(--pr);border:1px solid var(--bd)}
.btn.d{background:var(--rd);color:#fff}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--sf);width:100%;border-radius:24px 24px 0 0;padding:14px 8px calc(14px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto}
.dlg{background:var(--sf);width:calc(100% - 32px);margin:auto;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ov.c{align-items:center}
.sel{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:4px;padding:10px 14px;background:var(--pc);z-index:6}
.sel b{flex:1;font-weight:500}
.radar{position:relative;width:150px;height:150px;margin:20px auto;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pr);opacity:0;animation:rw 2.4s infinite}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
@keyframes rw{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.empty{text-align:center;color:var(--ts);padding:50px 20px}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;display:flex;justify-content:space-between;align-items:center}
.toast button{color:var(--pr);font-weight:700}
@media(prefers-reduced-motion:reduce){.radar i{animation:none;opacity:.4}}

.sv{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;overflow:visible}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}60%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:none}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
@keyframes zoom{from{opacity:0;transform:scale(.85)}}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
@keyframes pulse{50%{transform:scale(1.1)}}
.go>*,.go .row,.go .tile,.go .gf{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.go>:nth-child(2),.go .row:nth-child(2),.go .tile:nth-child(2),.go .gf:nth-child(2){animation-delay:.06s}
.go>:nth-child(3),.go .row:nth-child(3),.go .tile:nth-child(3),.go .gf:nth-child(3){animation-delay:.12s}
.go>:nth-child(4),.go .row:nth-child(4),.go .tile:nth-child(4),.go .gf:nth-child(4){animation-delay:.18s}
.go>:nth-child(5),.go .row:nth-child(5),.go .gf:nth-child(5){animation-delay:.24s}
.go>:nth-child(n+6),.go .row:nth-child(n+6),.go .gf:nth-child(n+6){animation-delay:.3s}
.go .ic .sv{animation:pop .6s cubic-bezier(.3,1.5,.5,1) .15s both}
.go .bar i{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) .2s both}
.ga h1{animation:tin .4s cubic-bezier(.2,.8,.2,1) both}
nav.ga button.on .sv{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.ov{animation:fade .25s both}
.sheet{animation:slide .4s cubic-bezier(.2,.9,.25,1) both}
.dlg{animation:zoom .35s cubic-bezier(.3,1.4,.5,1) both}
.toast{animation:tin .35s cubic-bezier(.2,.9,.3,1) both}
.row,.tile,.gf,.ib,.chip,.btn{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background-color .25s,border-color .25s}
.row:active,.gf:active,.chip:active,.btn:active{transform:scale(.96)}
.ib:active{transform:scale(.86)}
.chip.on{transform:scale(1.04)}
[style*="font-size:42px"],[style*="font-size:48px"]{animation:fl 3s ease-in-out infinite}
.radar .ic{animation:pulse 1.6s ease-in-out infinite}
body,.card,nav,.sheet,.dlg,input{transition:background-color .4s,color .4s,border-color .4s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
#app{height:100dvh}body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}input{-webkit-user-select:text;user-select:text}main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes sd{from{transform:translateY(-100%)}}@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.sel{animation:sd .3s cubic-bezier(.2,.9,.3,1) both}#sb>div{animation:tin .3s cubic-bezier(.2,.8,.2,1) both}
.pgb{position:absolute;top:0;left:0;right:0;height:3px;z-index:50;overflow:hidden}.pgb i{display:block;height:100%;width:40%;background:var(--pr);border-radius:3px;animation:ind 1.1s infinite ease-in-out}
input[type=search]{-webkit-appearance:none;appearance:none}.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
</style>
</head>

else if(a=='fav'){f.f=f.f?0:1;save();render()}
else if(a=='ren')ask('Cambiar nombre',f.n,v=>{f.n=v.replace(/\.[^.]+$/,'')||v;save();render()});
else if(a=='dupl'){const nid=++S.nid;S.files.push({...f,id:nid,n:f.n+'_copia',d:0,f:0});if(f.real)bget(fid).then(b=>b&&bput(nid,b));save();render();toast('Archivo duplicado')}
else if(a=='vault'){f.v=f.v?0:1;if(f.v)f.f=0;save();render();toast(f.v?'Movido a carpeta segura':'Fuera de carpeta segura')}
else if(a=='info')sheet('<div style="padding:10px 14px"><b>'+esc(fn(f))+'</b><p class="sub" style="margin-top:8px">Tipo: '+T[f.t][0]+'<br>Tamaño: '+sz(f.s)+'<br>Modificado: '+ag(f.d)+'<br>Ruta: /almacenamiento/'+T[f.t][0]+'/</p></div>');
else if(a=='trash')toTrash([fid],'1 archivo a la papelera');
else if(a=='restore'){f.x=0;save();render()}
else if(a=='delone'){bdel([fid]);S.files=S.files.filter(x=>x.id!=fid);save();render()}
else if(a=='clr'){S.sel.clear();render()}
else if(a=='bfav'){S.files.forEach(x=>{if(S.sel.has(x.id))x.f=1});S.sel.clear();save();render()}
else if(a=='bvault'){S.files.forEach(x=>{if(S.sel.has(x.id)){x.v=1;x.f=0}});S.sel.clear();save();render()}
else if(a=='btrash')toTrash([...S.sel]);
else if(a=='bres'){S.files.forEach(x=>{if(S.sel.has(x.id))x.x=0});S.sel.clear();save();render()}
else if(a=='bdel'){bdel([...S.sel]);S.files=S.files.filter(x=>!S.sel.has(x.id));S.sel.clear();save();render()}
else if(a=='empty'){bdel(S.files.filter(x=>x.x).map(x=>x.id));S.files=S.files.filter(x=>!x.x);save();render();toast('Papelera vaciada')}
else if(a=='new'){const t=S.cat&&T[S.cat]?S.cat:'doc';ask('Nuevo archivo',"",v=>{S.files.push({id:++S.nid,n:v,t,s:.1,d:0,f:0,v:S.cat=='vault'?1:0,x:0});save();render()})}
else if(a=='unlock'){if(S.pin)ask('PIN',"",v=>{if(v==S.pin){S.unlocked=true;render()}else toast('PIN incorrecto')},'password');else ask('Crear PIN (4-6 dígitos)',"",v=>{if(/^\d{4,6}$/.test(v)){S.pin=v;S.unlocked=true;save();render()}else toast('Usa 4 a 6 dígitos')},'password')}
else if(a=='cl'){if(id=='trash'){S.cat='trash';S.tab='home';render()}else if(id=='cache'){cacheMB=0;render();toast('Caché borrada')}else if(id=='dup'){const d=junk();if(d.length)toTrash(d.map(x=>x.id),d.length+' duplicados a la papelera');else toast('Sin duplicados')}else{S.cat=null;S.tab='home';S.sort='size';render()}}
else if(a=='cleanall'){bdel(S.files.filter(x=>x.x).map(x=>x.id));cacheMB=0;const d=junk().map(x=>x.id);S.files=S.files.filter(x=>!x.x);if(d.length)S.files=S.files.filter(x=>!d.includes(x.id));save();render();toast('Espacio liberado')}
else if(a=='cc'){S.tab='home';S.cat=id;S.sort=id=='big'?'size':'date';S.sel.clear();render()}else if(a=='selall'){list().forEach(f=>S.sel.add(f.id));render()}else if(a=='shr'){S.shr=id;render()}else if(a=='shl')shareText(listText(),'Mis archivos');else if(a=='csv')expCsv();else if(a=='cp'){try{navigator.clipboard.writeText(listText()).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'))}catch(x){toast('No se pudo copiar')}}else if(a=='shf'){if(NAT)shareFile(f);else toast('Solo disponible en la app')}else if(a=='exp'){const t=live().map(x=>fn(x)+'\t'+sz(x.s)).join('\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/plain'}));const l=document.createElement('a');l.href=u;l.download='archivos.txt';l.click();toast('Lista exportada')}catch(x){toast('No se pudo exportar')}}
else if(a=='cp'){const t=live().map(x=>fn(x)).join('\n');try{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'))}catch(x){toast('No se pudo copiar')}}
});
function tg(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render()}
let dbt;document.addEventListener('input',e=>{if(e.target.id=='qi'){S.q=e.target.value;clearTimeout(dbt);dbt=setTimeout(()=>{S.lim=100;body()},120)}});
let lastBack=0;
function goBack(){const o=document.querySelectorAll('.ov');if(o.length){o[o.length-1].remove();return true}
if(S.sel.size){S.sel.clear();render();return true}
if(S.cat||S.q||S.sch){S.cat=null;S.q='';S.sch=false;S.unlocked=false;render();return true}
if(S.tab!='home'){S.tab='home';render();return true}
return false}
if(NAT&&Capacitor.Plugins.App)Capacitor.Plugins.App.addListener('backButton',()=>{if(goBack())return;const n=Date.now();if(n-lastBack<2000)Capacitor.Plugins.App.exitApp();else{lastBack=n;toast('Presiona otra vez para salir')}});
applyTheme();render();if(NAT){L.get('perm',0)?scan():perm()}
})();
</script>
</body>
</html>
