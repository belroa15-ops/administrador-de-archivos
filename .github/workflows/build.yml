name: Crear APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Permisos y modulo de archivos
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:requestLegacyExternalStorage="true"'''
          s=s.replace('<application',perms,1)
          open(p,'w').write(s)
          PY
          D=android/app/src/main/java/com/miapp/administradorarchivos
          cat > $D/FileAccessPlugin.java <<'EOF'
          package com.miapp.administradorarchivos;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import org.json.JSONArray;

          @CapacitorPlugin(name = "FileAccess")
          public class FileAccessPlugin extends Plugin {
              private boolean allowed() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  return getContext().checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }
              @PluginMethod
              public void hasAccess(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("granted", allowed());
                  call.resolve(o);
              }
              @PluginMethod
              public void requestAccess(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 30) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  }
                  call.resolve();
              }
              @PluginMethod
              public void scan(PluginCall call) {
                  new Thread(() -> {
                      try {
                          JSONArray a = new JSONArray();
                          walk(Environment.getExternalStorageDirectory(), a, 0);
                          JSObject o = new JSObject();
                          o.put("files", a);
                          call.resolve(o);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }
              private void walk(File d, JSONArray a, int depth) {
                  File[] list = d.listFiles();
                  if (list == null || depth > 12) return;
                  for (File f : list) {
                      if (a.length() >= 20000) return;
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      if (f.isDirectory()) {
                          if (depth == 0 && n.equals("Android")) continue;
                          walk(f, a, depth + 1);
                      } else {
                          JSONArray r = new JSONArray();
                          r.put(f.getAbsolutePath());
                          r.put(f.length());
                          r.put(f.lastModified());
                          a.put(r);
                      }
                  }
              }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.miapp.administradorarchivos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FileAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
      - run: npx cap sync android
      - name: Firma fija
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Administrador-De-Archivos.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Administrador De Archivos v${{ github.run_number }}
          files: Administrador-De-Archivos.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: Administrador-De-Archivos-APK
          path: Administrador-De-Archivos.apk
